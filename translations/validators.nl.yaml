# Our own validation messages; Symfony's standard ones come with the bundle
'A username cannot contain spaces or an @.': 'Een gebruikersnaam mag geen spaties of @ bevatten.'
'Invalid recurrence rule: {{ error }}': 'Ongeldige herhaalregel: {{ error }}'
'Only lowercase letters, numbers and underscores are allowed': 'Alleen kleine letters, cijfers en underscores zijn toegestaan'
'Please choose the last date of the series.': 'Kies de laatste datum van de reeks.'
'Please complete the recurrence: check the end date or number of occurrences.': 'Vul de herhaling aan: controleer de einddatum of het aantal keer.'
'Please enter a name': 'Vul een naam in'
'Please enter a password': 'Vul een wachtwoord in'
'Please enter the number of occurrences.': 'Vul het aantal keer in.'
'Please enter your email': 'Vul je e-mailadres in'
'Subscription exceeds subscriber limit for this event, limit is {{ limit }}': 'Deze aanmelding gaat over het maximum aantal aanmeldingen voor deze activiteit; het maximum is {{ limit }}'
'The end date must be after the start date.': 'De einddatum moet na de startdatum liggen.'
'The password fields must match.': 'De wachtwoorden moeten overeenkomen.'
'There is already a tag with this name': 'Er bestaat al een tag met deze naam'
'There is already an account with this username': 'Er bestaat al een account met deze gebruikersnaam'
'This email address is already in use': 'Dit e-mailadres is al in gebruik'
'You are already subscribed to this event': 'Je bent al aangemeld voor deze activiteit'
'You should agree to our terms.': 'Je moet akkoord gaan met onze voorwaarden.'
'Your password should be at least {{ limit }} characters': 'Je wachtwoord moet minstens {{ limit }} tekens lang zijn'
